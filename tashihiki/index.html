<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>たしひきラボ</title>
<meta name="theme-color" content="#42a5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たしひきラボ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* layout: 縦持ちタブレットで1画面。上=絵(たて×よこ, 5の仕切り線, 点はその場で5・10のかたまりになる), 中=たて・よこ・こたえ, 下=4×4テンキー */
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#2b2a33; --muted:#6f6b78; --line:#e0dacb;
  --accent:#e4572e; --accent-ink:#fff; --dot:#2f7fd1; --five:#e8862e; --ten:#f2c230; --sq:#7c5cd6; --ok:#2e9c6a; --ng:#d1544f; --sep:#b89a4a;
  --pA:#f2a93b; --pB:#2f7fd1; --pC:#2e9c6a; --pD:#8e5fd1; --pE:#e4572e; --pF:#1f8a9e; --pG:#c2185b;
  --font-display:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --d:36px; --g:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1c22; --paper:#2a2730; --ink:#f3efe6; --muted:#aaa4b3; --line:#413c48; --accent:#ff7a4e; --accent-ink:#1e1c22; --dot:#6fb0ff; --five:#ff9d4d; --ten:#ffd54a; --sq:#b48cf0; --ok:#49c389; --ng:#ff6f61; --sep:#d9b85a;
  --pA:#ffc46a; --pB:#6fb0ff; --pC:#49c389; --pD:#b48cf0; --pE:#ff7a4e; --pF:#4fc3d6; --pG:#f06292; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1c22; --paper:#2a2730; --ink:#f3efe6; --muted:#aaa4b3; --line:#413c48; --accent:#ff7a4e; --accent-ink:#1e1c22; --dot:#6fb0ff; --five:#ff9d4d; --ten:#ffd54a; --sq:#b48cf0; --ok:#49c389; --ng:#ff6f61; --sep:#d9b85a;
  --pA:#ffc46a; --pB:#6fb0ff; --pC:#49c389; --pD:#b48cf0; --pE:#ff7a4e; --pF:#4fc3d6; --pG:#f06292; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 12px;
  max-width:900px;margin:0 auto;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--dot);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:6px;min-height:36px;margin-bottom:4px}
.topbar .sp{flex:1}
.stageTag{font-family:var(--font-display);font-weight:900;font-size:.85rem;border-radius:999px;padding:4px 10px;color:#2b2a33;background:var(--ten);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-family:var(--font-display);font-weight:900;font-size:.9rem;max-width:7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who:empty{display:none}
.progress{font-size:15px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-display);font-weight:700;border:none;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-size:1.05rem;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.sm{font-size:.85rem;padding:6px 10px}
#play{flex:1;display:flex;flex-direction:column;min-height:0}
.prog{display:flex;gap:5px;align-items:center;margin-bottom:4px}
.prog i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);display:block}
.prog i.p{background:var(--ok);border-color:var(--ok)}
.prog i.o{background:var(--ten);border-color:var(--ten)}
.qtitle{text-align:center;font-family:var(--font-display);font-size:clamp(18px,3.2vw,26px);font-weight:900;letter-spacing:2px;margin:2px 0 6px}
/* 絵 */
.stagewrap{position:relative;display:flex;justify-content:center}
.grid{position:relative;display:grid;gap:var(--g);padding:calc(var(--g)*.5 + 2px)}
.cell{position:relative;width:var(--d);height:var(--d);padding:0;border:0;background:transparent;cursor:pointer}
.cell .dd{position:absolute;inset:0;border-radius:50%;background:var(--dot);transition:background .15s,border-radius .15s}
.cell.c5 .dd{background:var(--five);border-radius:30%}
.cell.c10 .dd{background:var(--ten);border-radius:30%}
.cell.csq .dd{background:var(--sq);border-radius:30%}
.cell .br{position:absolute;background:var(--five);z-index:0}
.cell.c10 .br{background:var(--ten)}
.cell.csq .br{background:var(--sq)}
.read b.q{color:var(--sq)}
.cell .br.r{left:calc(100% - 1px);top:28%;height:44%;width:calc(var(--g) + 2px)}
.cell .br.d{top:calc(100% - 1px);left:28%;width:44%;height:calc(var(--g) + 2px)}
.cell.lead::after{content:attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:calc(var(--d)*.5);color:#2b2a33;z-index:1}
.sepv,.seph{position:absolute;pointer-events:none;border:0;border-left:3px dashed var(--sep)}
.seph{border-left:0;border-top:3px dashed var(--sep)}
.startflash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--font-display);font-weight:900;font-size:clamp(28px,6vw,56px);color:var(--muted);border-radius:12px;z-index:3}
.read{text-align:center;font-family:var(--font-display);font-weight:900;font-size:clamp(16px,2.8vw,24px);min-height:1.4em;font-variant-numeric:tabular-nums;margin-top:2px}
.read b.t{color:var(--ten)}.read b.f{color:var(--five)}
/* かたまりづくり（ステージ終わりの 復習・レベルアップ チャレンジ）の 演出 */
.ovl{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(20,16,30,.6);padding:16px}
.ovbox{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 26px;text-align:center;max-width:440px;width:100%;animation:ovpop .5s cubic-bezier(.2,1.6,.4,1)}
.ovt{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,7vw,48px);color:var(--accent);line-height:1.25}
.ovs{margin:10px 0 16px;font-size:1.05rem;line-height:1.7}
.ovl.reach{background:radial-gradient(circle,rgba(255,235,59,.6),rgba(229,57,53,.8))}
.ovl.reach .ovt{color:#e53935;animation:reachbeat .45s infinite alternate;text-shadow:0 0 14px #ffeb3b}
.ovl.lvup{background:radial-gradient(circle,rgba(255,241,118,.7),rgba(46,156,106,.8))}
.ovl.lvup .ovt{color:#f9a825;text-shadow:0 2px 0 #fff3}
.ovl .spark{position:absolute;font-size:34px;animation:spark 1.4s ease-out infinite;pointer-events:none}
@keyframes ovpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes reachbeat{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.15) rotate(3deg)}}
@keyframes spark{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-120px) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.ovbox,.ovl .ovt,.ovl .spark{animation:none}}
.prog .gap{display:inline-block;width:14px}
.cell.ghost .dd{background:transparent!important;border:2px dashed var(--muted);box-sizing:border-box;opacity:.8}
.bhint{text-align:center;font-weight:800;color:var(--accent);font-size:clamp(14px,2.4vw,18px);line-height:1.5;margin:2px 8px}
.bhint.warn{color:#fff;background:var(--ng);border-radius:10px;padding:4px 10px}
/* 入力 */
.answerrow{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.5vw,14px);margin-top:6px;flex-wrap:wrap}
.answerrow .lb{font-family:var(--font-display);font-weight:800;font-size:clamp(16px,2.6vw,22px)}
.answerrow .x{color:var(--muted);font-size:clamp(18px,3vw,26px);font-weight:800}
.numin{width:clamp(56px,10vw,84px);height:clamp(46px,8vw,66px);font-size:clamp(24px,4.4vw,36px);text-align:center;font-family:var(--font-display);font-weight:900;
  border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;cursor:pointer}
.numin.ans{width:clamp(76px,14vw,120px)}
.numin.active{border-color:var(--dot);box-shadow:0 0 0 4px color-mix(in srgb,var(--dot) 25%,transparent)}
.numin.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.numin.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--paper))}
.numin.rej{border-color:var(--ng)!important;background:#ffcdd2!important;animation:rejshake .2s}
@keyframes rejshake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
/* こたえた 直後の 大きな 丸（みどり＝ぱっと見、きいろ＝せいかい） */
.mark{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:markfade .9s ease-out forwards}
.mark .mk{width:min(58vw,300px);height:min(58vw,300px);border-radius:50%;border:min(7vw,36px) solid;box-sizing:border-box;background:color-mix(in srgb,var(--paper) 55%,transparent)}
.mark.g .mk{border-color:#2e9c6a}.mark.y .mk{border-color:#f2c230}
.mark .mq{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,7vw,50px);margin-top:10px;color:var(--ink);background:var(--paper);padding:2px 16px;border-radius:14px;font-variant-numeric:tabular-nums}
.mark .ms{font-weight:800;font-size:clamp(16px,3vw,22px);margin-top:4px;background:var(--paper);padding:0 10px;border-radius:10px}
@keyframes markfade{0%{transform:scale(.6);opacity:0}18%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
.msgbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:2;gap:2px}
.msgbox.has{background:color-mix(in srgb,var(--paper) 82%,transparent);border-radius:12px}
.msgbox .err:empty,.msgbox .verdict:empty,.msgbox .eqline:empty{display:none}
.err{background:var(--paper);border-radius:8px;padding:2px 10px}
@media (max-height:720px){.qtitle{font-size:16px;margin:0 0 4px}.prog{margin-bottom:2px}#padwrap{min-height:200px}.answerrow{margin-top:4px}.read{min-height:1.2em}}
.err{color:var(--ng);font-size:15px}
.verdict{font-family:var(--font-display);font-weight:900;font-size:clamp(22px,4vw,36px)}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--accent)}
.tchip{display:inline-block;margin-left:.4em;font-size:.55em;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:.1em .6em;color:var(--muted);vertical-align:middle;font-variant-numeric:tabular-nums}
.eqline{font-size:clamp(18px,3vw,28px);font-weight:800;font-variant-numeric:tabular-nums}
#padwrap{flex:1;display:flex;min-height:230px}
.pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(8px,1.6vw,14px);max-height:560px;width:100%;margin:6px auto 0}
.key{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,6vw,60px);min-height:0;border:3px solid var(--line);border-radius:clamp(14px,2.4vw,22px);background:var(--paper);color:var(--ink);cursor:pointer}
.key:active{transform:scale(.96)}
.key.del{font-size:clamp(18px,3.4vw,34px);color:var(--muted);background:var(--bg)}
.key.zero{grid-column:span 3}
.key.enter{grid-column:4;grid-row:2 / span 3;background:var(--dot);border-color:var(--dot);color:#fff;font-size:clamp(20px,3.6vw,36px);writing-mode:vertical-rl;letter-spacing:6px}
.key.enter:disabled{opacity:.4;cursor:default;transform:none}
.pad.locked .key:not(.enter){opacity:.3;pointer-events:none}
/* result */
.result{text-align:center;padding:10px 0}
.badge{width:120px;height:120px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:1.3rem;color:#2b2a33;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.15);border:6px solid var(--paper)}
.badge.g{background:linear-gradient(160deg,#ffe27a,#e5a900)}
.badge.s{background:linear-gradient(160deg,#f2f2f2,#aeb4bd)}
.badge.b{background:linear-gradient(160deg,#e8a97a,#a8622e)}
.badge.st{font-size:2rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.result h2{font-family:var(--font-display);font-size:1.4rem;margin:6px 0}
.shelf{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-weight:800;font-variant-numeric:tabular-nums}
.shelf span{display:flex;align-items:center;gap:6px}
.shelf i{width:22px;height:22px;border-radius:50%;display:inline-block}
.shelf i.g{background:#e5a900}.shelf i.s{background:#aeb4bd}.shelf i.b{background:#a8622e}
/* map */
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px}
.cap{font-weight:800;color:var(--muted);font-size:.8rem;letter-spacing:.06em}
.phase{margin-bottom:12px}
.phase h3{font-family:var(--font-display);font-size:.95rem;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.phase h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mcell{aspect-ratio:1;border-radius:14px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;cursor:pointer;color:var(--ink);padding:0}
.mcell small{font-size:.65rem;font-weight:700;color:var(--muted);line-height:1.1}
.mcell.done{color:#fff;border-color:transparent}
.mcell.done small{color:rgba(255,255,255,.85)}
.mcell.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.mcell.lock{opacity:.4;cursor:default}
/* islands */
.bigbar{margin:4px 0 14px}
.bigbar .lab{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:800;font-size:.95rem}
.bigbar .lab b{font-variant-numeric:tabular-nums}
.bigbar .track{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bigbar .fill{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.sea{display:flex;flex-direction:column;gap:14px}
.island{position:relative;border-radius:40px 60px 50px 70px / 50px 40px 70px 50px;padding:14px 16px 12px;border:3px solid var(--il);background:color-mix(in srgb,var(--il) 14%,var(--paper))}
.island h3{font-family:var(--font-display);font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.island h3 .no{width:26px;height:26px;border-radius:50%;background:var(--il);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.island .medal{margin-left:auto;font-family:var(--font-display);font-weight:900;font-size:.8rem;background:var(--il);color:#fff;border-radius:999px;padding:3px 10px}
.island .medal.off{background:var(--paper);color:var(--muted);border:2px dashed var(--line)}
.island.done{box-shadow:0 0 0 4px color-mix(in srgb,var(--il) 35%,transparent)}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.step{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;cursor:pointer;color:var(--ink);padding:0;font-size:1.1rem;line-height:1}
.step small{font-size:.55rem;font-weight:700;color:var(--muted);line-height:1.1;max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{background:var(--il);border-color:var(--il);color:#fff}
.step.done small{color:rgba(255,255,255,.85)}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.step.lock{opacity:.35;cursor:default}
.mapbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* license */
.lic{width:min(100%,420px);margin:10px auto;border:4px solid var(--ten);border-radius:18px;padding:16px 18px;background:var(--paper);position:relative;font-family:var(--font-display)}
.lic .t{font-size:.8rem;letter-spacing:.2em;color:var(--muted);font-weight:800}
.lic h2{margin:2px 0 8px;font-size:1.5rem}
.lic .nm{font-size:1.6rem;font-weight:900;border-bottom:3px solid var(--line);padding:4px 0;min-height:1.6em}
.lic .row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:.9rem;font-weight:700;flex-wrap:wrap}
.lic .seal{position:absolute;right:14px;top:14px;width:64px;height:64px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;text-align:center;line-height:1.1;transform:rotate(-12deg)}
.lic input{font-family:inherit;font-size:1.4rem;font-weight:900;border:none;border-bottom:3px solid var(--line);background:transparent;color:var(--ink);width:100%;outline:none}
/* report & print */
.rep{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.95rem;line-height:1.6}
.rep h3{font-family:var(--font-display);font-size:1rem;margin:0 0 6px}
.rep textarea{width:100%;min-height:140px;font-family:inherit;font-size:.9rem;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
.rep .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#printArea{display:none}
@media print{
  body{display:block;padding:0;max-width:none;background:#fff;color:#000}
  .topbar,#play,#map,#rep,.noprint{display:none!important}
  #printArea{display:block}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}
.sheet{width:186mm;height:268mm;overflow:hidden;margin:0 auto;color:#000;background:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;page-break-after:always;display:flex;flex-direction:column}
.sheet:last-child{page-break-after:auto}
.sh{display:flex;align-items:baseline;gap:8mm;border-bottom:2px solid #000;padding-bottom:2mm;margin-bottom:3mm}
.sh h1{font-size:14pt;margin:0}
.sh .meta{font-size:10pt;margin-left:auto}
.sh .meta span{display:inline-block;border-bottom:1px solid #000;min-width:30mm;margin-left:2mm}
.ptwo{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm;flex:1;min-height:0}
.prow{display:flex;align-items:center;gap:3mm;padding:2mm 0;border-bottom:1px solid #999;min-height:0}
.prow .no{font-size:10pt;width:6mm}
.pgrid{position:relative;display:grid;gap:1.1mm;padding:1mm}
.pgrid i{width:2.8mm;height:2.8mm;border-radius:50%;background:#333;display:block}
.pgrid .pv{position:absolute;top:0;bottom:0;border-left:.6mm dashed #444}
.pgrid .ph{position:absolute;left:0;right:0;border-top:.6mm dashed #444}
.pfill{margin-left:auto;display:flex;align-items:center;gap:2mm;font-size:11pt;white-space:nowrap}
.pbox{display:inline-block;width:9mm;height:8mm;border:1px solid #000;border-radius:1mm;vertical-align:middle}
.pbox.w{width:14mm}
.pdraw{display:flex;align-items:center;gap:5mm;padding:2mm 0;border-bottom:1px solid #999;height:26mm}

/* gate & teacher */
.gate h2{font-family:var(--font-display);font-size:1.3rem;margin:4px 0 8px}
.gate p{margin:4px 0 10px;line-height:1.6}
.gate input{font-family:inherit;font-size:1.3rem;font-weight:800;border:3px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;background:var(--paper);color:var(--ink)}

.codebox{font-family:ui-monospace,monospace;font-size:.85rem;background:var(--bg);border-radius:8px;padding:6px 8px;word-break:break-all;user-select:all}
/* みんなの様子 */
.board{overflow-x:auto;margin:6px 0 4px}
.board table{border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums;font-size:.78rem}
.board th,.board td{padding:0;text-align:center}
.board th.nm,.board td.nm{position:sticky;left:0;background:var(--paper);text-align:left;padding:0 8px 0 2px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;font-weight:800;z-index:1}
.board td.nm small{font-weight:400;color:var(--muted);margin-left:4px}
.board .ph{height:6px;border-radius:3px}
.board th.n{width:22px;color:var(--muted);font-weight:800}
.board td.c{width:22px;height:20px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.board td.c.d{background:var(--pc);border-color:var(--pc)}
.board td.c.cur{background:var(--paper);border:3px solid var(--accent)}
.board td.c.cur.d{background:var(--pc)}
.board tr.idle td.nm{color:var(--muted);font-weight:400}
.board tr.me td.nm{color:var(--accent)}
.board tr.me td.c{box-shadow:0 0 0 1px var(--accent)}
.board tr.idle td.c.cur{border-color:var(--muted)}
.board tr.dist td{height:auto;font-weight:900;font-size:.8rem;color:var(--ink)}
.board tr.dist td .bub{display:inline-flex;min-width:20px;height:20px;border-radius:10px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);padding:0 4px}
.board .meta{color:var(--muted);font-weight:400;white-space:nowrap;padding:0 4px;text-align:left}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line);background:var(--bg)}
.legend i.d{background:var(--pB);border-color:var(--pB)}
.legend i.cur{background:var(--paper);border:3px solid var(--accent)}
/* がんばりグラフ */
.ghchart{display:block;width:100%;max-width:560px;height:auto;margin:6px auto 8px;background:var(--paper);border:2px solid var(--line);border-radius:12px}
.grlead{font-family:var(--font-display);font-weight:900;font-size:1.25rem;margin:4px 0 8px}
.adultbox{margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.adultbox summary{cursor:pointer;font-weight:800;color:var(--muted)}
@media print{.ghchart{border-color:#999;max-width:150mm}}
/* adult */
.adult{margin-top:12px;font-size:.85rem;color:var(--muted)}
.adult table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.adult td,.adult th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}

.chip{border-radius:6px;padding:1px 6px;font-weight:800;font-size:.8rem;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.m{background:color-mix(in srgb,var(--ok) 25%,var(--paper))}
.chip.w{background:color-mix(in srgb,var(--accent) 22%,var(--paper))}

/* ===== 部品ここから（ほかのラボに そのまま 写す） ===== */
.ryo{position:relative;width:100%;overflow-x:auto;overflow-y:hidden;background:var(--paper);border-radius:16px;
  --dur:.55s;--u:14px}
.ryo .it{position:absolute;left:0;top:0;transition:transform var(--dur) ease,opacity var(--dur) ease;will-change:transform}
.ryo .it::before{content:"";position:absolute;inset:0;border-radius:calc(var(--u)*.3);border:2px solid transparent;transition:border-color var(--dur),background var(--dur)}
.ryo .it.t::before{border-color:var(--ten)}
.ryo .it.h::before{border-color:var(--ok)}
.ryo .it.fresh::before{border-color:transparent;background:transparent}
.ryo .c{position:absolute;width:var(--u);height:var(--u);transition:opacity var(--dur),transform var(--dur)}
/* タイル（たしざんラボと同じ色・形）。ぼう・いたの中は すきまなく並べ、さかいめの線だけ見せる */
.ryo .c::after{content:"";position:absolute;inset:0;background:var(--dot);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dot) 55%,var(--paper));transition:background var(--dur),box-shadow var(--dur)}
.ryo .c.b::after{background:var(--five);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--five) 55%,var(--paper))}
.ryo .c.take::after{background:var(--ng);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ng) 55%,var(--paper))}
.ryo .it.o .c::after{border-radius:25%;box-shadow:none}
.ryo .c.gone{opacity:0;transform:scale(.3)}
.ryo .it.gone{opacity:0}
.ryo .it.hl::before{border-color:var(--accent)!important;border-width:3px}
.ryo .sign{position:absolute;left:0;top:0;font-family:var(--font-display);font-weight:900;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:transform var(--dur),opacity var(--dur)}
.ryo .note{position:absolute;right:8px;top:6px;font-family:var(--font-display);font-weight:900;color:var(--ng);font-size:clamp(16px,3vw,22px)}
/* ===== 部品ここまで（CSS） ===== */
/* たしひきラボ: 九九ラボの 見た目に タイルの 絵を のせる */
.stagewrap{min-height:clamp(190px,30vh,290px)}
.field{position:relative;width:min(94vw,640px);background:var(--paper);border:3px solid var(--line);border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:clamp(190px,30vh,290px)}

.note{font-size:.85rem;color:var(--muted)}

/* 補数の わく（横ならび。5こずつ）と くさむら */
.trow{--ts:clamp(22px,min(5.4vw,4vh),40px);position:relative;display:flex;gap:calc(var(--ts)*.5);padding:14px calc(var(--ts)*1.4) 34px 12px;align-items:center}

.g5w.full::after{content:"5";position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);font-family:var(--font-display);font-weight:900;font-size:calc(var(--ts)*.75);color:var(--ink)}
.bush{position:absolute;top:2px;bottom:22px;border-radius:26px;background:color-mix(in srgb,var(--ok) 40%,var(--paper));border:3px solid color-mix(in srgb,var(--ok) 65%,var(--paper));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:calc(var(--ts)*1.1);color:color-mix(in srgb,var(--ok) 80%,var(--ink));transition:transform .55s ease,opacity .55s ease;z-index:2}
.bush.off{opacity:0;transform:translateX(30%)}
.bush.lift{opacity:0;transform:translateY(-120%)}
.fscene{--fd:clamp(18px,min(4.6vw,3.8vh),44px);--fg:calc(var(--fd)*.18);position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--fd)*.45);padding:14px 10px}
.fscene.n3{--fd:clamp(13px,min(3.3vw,3.4vh),34px)}
.fr{display:grid;grid-template-columns:repeat(5,var(--fd));gap:var(--fg);padding:var(--fg);border:3px solid var(--line);border-radius:16px;background:var(--paper);transition:border-color .3s,background .3s}
.fr.full{border-color:var(--dot);background:color-mix(in srgb,var(--dot) 8%,var(--paper))}
.fc2{width:var(--fd);height:var(--fd);border-radius:25%;border:2px dashed var(--line)}
.ft{position:absolute;width:var(--fd);height:var(--fd);border-radius:25%;background:var(--dot);transition:left .55s cubic-bezier(.34,1.2,.5,1),top .55s cubic-bezier(.34,1.2,.5,1),opacity .45s,transform .45s}
.ft.hl{box-shadow:0 0 0 3px var(--accent)}.ft.gone{opacity:0!important;transform:translateY(-60%)}
.fscene.col{flex-direction:column;gap:calc(var(--fd)*.3)}
.ft.b{background:var(--five)}.ft.x{background:var(--ng);opacity:.4}
.ktabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ktab{font:inherit;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ktab.sel{border-color:var(--dot);background:color-mix(in srgb,var(--dot) 14%,var(--paper))}.ktab.none{opacity:.45}
.kbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--paper)}
.kbox .ct{font-size:.8rem;color:var(--muted);font-weight:700}.kbox .cv{font-family:var(--font-display);font-size:1.5rem;font-weight:900}

table.krec{width:100%;border-collapse:collapse;font-size:.9rem}table.krec th,table.krec td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}table.krec th{color:var(--muted);font-size:.75rem}
.kempty{padding:24px;text-align:center;color:var(--muted)}
.fscene.tapfr{--fd:clamp(34px,min(9vw,6vh),64px)}
.ft{pointer-events:none}.fc2.tapc{cursor:pointer;background:color-mix(in srgb,var(--paper) 70%,#fff)}.fc2.tapc:active{background:color-mix(in srgb,var(--dot) 25%,var(--paper))}

.fr.five .fc2:nth-child(-n+5){border:2px solid var(--accent)}
.tscene.ldscene{flex-direction:column;align-items:center;gap:0}

.fscene.mv{--fd:clamp(20px,min(5.8vw,4.6vh),52px)}
.fscene.mv .ft{pointer-events:auto;cursor:pointer;touch-action:manipulation}.fscene.mv .ft:active{transform:scale(.9)}
.fr.five{border-color:var(--accent)}
.tc.g{background:color-mix(in srgb,var(--ok) 42%,var(--paper));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ok) 70%,var(--paper));color:#fff;font-weight:900;display:flex!important;align-items:center;justify-content:center;font-size:calc(var(--ts)*.55)}
.sbag .tc.a{cursor:pointer;position:relative;z-index:4}.sbag .sbush{z-index:3;border-radius:18px;pointer-events:none}.sbag .sbush span{font-size:calc(var(--ts)*1.1)}
.tc.v{visibility:hidden}.dlow .g5w{border-color:transparent}.dlow{cursor:pointer}
.tapl .tc.own{cursor:pointer;touch-action:manipulation}.tapl .tc{transition:background .25s,opacity .25s}.tapl .tc.gone2{background:var(--dot);opacity:.18}.tlreset{margin-top:10px}
.tscene.lnscene{--ts:clamp(24px,min(6.6vw,5vh),52px);--lg:calc(var(--ts)*.14);position:relative;flex-direction:column;align-items:center;gap:18px;width:100%;padding:10px 0 30px}

.lnslot{position:relative;width:var(--ts);height:var(--ts);border-radius:25%;border:2px dashed var(--line);transition:background .3s}

.lnslot.gap{background:var(--five);border-color:var(--five)}
.lnno{position:absolute;left:50%;bottom:calc(var(--ts)*-.72);transform:translateX(-50%);font-family:var(--font-display);font-weight:900;font-size:calc(var(--ts)*.42);color:var(--ink-soft,#777)}
.lnslot.l5 .lnno,.lnslot:last-child .lnno{color:var(--ink);font-size:calc(var(--ts)*.5)}
.lnblk{position:absolute;display:flex;gap:var(--lg);padding:0;cursor:grab;touch-action:none;transition:left .2s,top .2s;z-index:3}
.lnblk.drag{transition:none;cursor:grabbing;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.lnblk .tc{width:var(--ts);height:var(--ts)}

.tkrow{display:flex;gap:calc(var(--ts)*.35);padding:5px 8px;align-self:center}

.tkrow .tc{transition:background .3s,opacity .3s}.tkrow .tc.v{visibility:hidden}
.lrow .tc{transition:background .3s,opacity .3s}
.fsign{font-family:var(--font-display);font-weight:900;font-size:calc(var(--fd)*1.1);color:var(--muted)}

/* たしひきラボ: タイル（たしざんラボと同じ 色・形）。たてに 下から つむ */
.field.scene{height:auto;min-height:clamp(190px,32vh,290px);display:flex;align-items:center;justify-content:center}

<script>
(function(){

/* ===== レベル（30段階案。いまは Lv1〜20「ばらの せかい」まで。Lv1 は 0〜5 まとめ、Lv2〜13 で 6〜10 を 手あつく。ドットの 7コース（5の なかま〜たしざん②）を ふくむ） =====
   第1部 ばらの せかい（10をつくる・10からとる）／第2部 ぼうの せかい（100をつくる・100からとる）／第3部 いたの せかい（3けた）
   facts は そのレベルで 出す問題の しゅるい（key）。key ごとに 2回つづけて できたら「できた」。 */
const PH=[['1','ばらの せかい','--pA'],['2','ぼうの せかい','--pB'],['3','いたの せかい','--pC']];
const ISLAND=PH.map(x=>x[1]);
const LEVELS=[
 [0,'0〜5 まとめ'],[0,'どこまで？'],[0,'6〜10は いくつ'],[0,'6〜10を 見る'],[0,'5と いくつで'],[0,'5を こえる たしざん'],[0,'5を こえる（式だけ）'],[0,'6〜9＋小さい数'],[0,'6〜10の 分解①'],[0,'6〜10の 分解②'],[0,'6〜10の 分解③'],[0,'10の なかま'],[0,'のこりは'],[0,'ちがいは'],[0,'ひきざん（式だけ）'],[0,'10と いくつ'],[0,'くりあがり①'],[0,'くりあがり②'],[0,'たしざん②'],[0,'くりさがり'],[0,'まぜて 20まで'],
 [1,'何十の たしひき'],[1,'100は いくつと いくつ'],[1,'2けたと 1けた'],[1,'つぎの 何十を つくる'],[1,'ぼうから とる'],[1,'2けたと 2けた'],
 [1,'何十で 100を こえる'],[1,'100を つくる'],[1,'100から とる'],[1,'たして ひいて 200まで'],[1,'まぜて 200まで'],
 [2,'何百の たしひき'],[2,'何百から とる'],[2,'3けたと 1・2けた'],[2,'3けたの たしざん'],[2,'3けたの ひきざん'],[2,'1000まで まとめ'],
];
const S=(name,facts,ms,gen,review,lim)=>({name,facts,ms,gen,review:!!review,lim});
const STAGES=[
 S('0〜5 まとめ',['みる','どこまで','たす','かくす'],1200,k=>gen05(k),1),   // 0〜5 の 総復習（くわしくは べつアプリ）
 S('どこまで？',[6,7,8,9,10],0,k=>genWhere(k),0,3),                      // 教える: 数字→量（わくを タップ）
 S('6〜10は いくつ',[6,7,8,9,10],0,k=>genCount(k),0,3),              // なれる: 量→数字（目かくし なし。なれない うちは かぞえて よい。時間で 判定）
 S('6〜10を 見る',[6,7,8,9,10],1000,k=>genSee(k),0,3),              // タイル→数（5と なんぼで 見る）
 S('5と いくつで',[1,2,3,4,5],0,k=>genFivePlus(k),0,3),              // 式→数（5＋□）
 S('5を こえる たしざん',[6,7,8],0,k=>genOver5Mv(k),0,5),            // ためす: タイルを おして うごかす。時間切れで「こう うごかすと はやいよ」
 S('5を こえる（式だけ）',[6,7,8],0,k=>genOver5(k,true),0,3),
 S('6〜9＋小さい数',['6+1','6+2','6+3','6+4','7+1','7+2','7+3','8+1','8+2','9+1'],0,k=>genSmallAddMv(k),0,5),   // ためす（Lv6と おなじ）
 S('6〜10の 分解①',[7,8,9,10],1500,k=>genBag(k,6,9)),               // 6〜10 の 定着テスト。3セットで クリア できなければ Lv6 へ
 S('6〜10の 分解②',[6,7,8,9],0,k=>sideBag(k,1,4,1,5),0,4),          // ためす: 見えている タイルを おすと 左右が いれかわる（どちらから 見るかは 子ども）
 S('6〜10の 分解③',[7,8,9,10],0,k=>sideBag(k,1,4,6,9),0,4),
 S('10の なかま',[1,2,3,4,5,6,7,8,9],0,k=>lineFill(k),0,5.5),          // ためす: タイルの かたまりを 数直線に ドラッグ（どこに おいても よい）
 S('のこりは',[6,7,8,9,10],0,k=>tapLeft(k),0,6),                      // ためす: おすと きえる（5の かたまりは まとめて きえる）
 S('ちがいは',[6,7,8,9,10],0,k=>diffToggle(k),0,6),                   // ためす: 下の だんを おすと 左よせ・右よせ
 S('ひきざん（式だけ）',[6,7,8,9,10],0,k=>genLeftEq(k),0,4),           // なれる: 式だけ。どう（ぱっと見 6こ いか）なら Lv13 へ
 S('10と いくつ',['10たす','じゅうたす','じゅうひくばら','じゅうひく'],1200,k=>genTeen(k)),
 S('くりあがり①',[6,7,8,9],1500,k=>genFive(k)),                     // ドット「くりあがり① 5と5で 10」
 S('くりあがり②',[6,7,8,9],1500,k=>genMake(k)),                     // ドット「くりあがり② 10を つくる」
 S('たしざん②',[6,7,8,9],1200,k=>genCarry(k)),                      // ドット「たしざん② くりあがり あり」
 S('くりさがり',[2,3,4,5,6,7,8,9],1500,k=>genTake(k)),
 S('まぜて 20まで',['くりあがり','くりさがり','10と いくつ','10まで'],0,k=>genMix(k),1),
];
STAGES.forEach((s,i)=>{s.p=LEVELS[i][0];s.lv=i+1});

async function boot(){
  const q=new URLSearchParams(location.search);
  if(q.has('teacher'))return teacherScreen();
  if(!db){start();return} // オフライン: 端末内だけで動く
  const code=(q.get('i')||'').toUpperCase();
  try{
    if(code){
      const d=await db.collection(COL.invites).doc(code).get();
      if(!d.exists){gate(`<h2>この URL は つかえません</h2><p>コード <b>${esc(code)}</b> が みつかりません。</p>`);return}
      const inv=d.data();
      if(Array.isArray(inv.cands)&&inv.cands.length>1)return chooseKid(code,inv.cands);
      if(inv.uid&&await loadKid(inv.uid,code))return;
      /* 以前の作り（端末に かぎを おぼえる）で この コードから 登録した子: この 端末の かぎで コードを おさえて つづきから */
      if(!inv.uid){const old=lsGet(LS.token);
        if(old){try{const u=await db.collection(COL.users).doc(old).get();
          if(u.exists&&u.data().inv===code){await db.collection(COL.invites).doc(code).update({uid:old,usedAt:firebase.firestore.FieldValue.serverTimestamp()});if(await loadKid(old,code))return}}catch(e){}}}
      return registerScreen(code,inv,inv.uid||null);
    }
    if(q.get('t')&&await loadKid(q.get('t')))return; // 以前の ひきつぎ URL
  }catch(e){gate(`<h2>よみこめませんでした</h2><p>電波を たしかめて、もういちど ひらいてください。</p>`);return}
  gate(`<h2>${APP}</h2><p>先生や、つかっている人から もらった URL から ひらいてください。</p><p><a href="${BLOG}" target="_blank" rel="noopener">塾のブログ</a></p>`);
}

/* 登録: 先に コードを 押さえて（1コード 1人）、押さえられたら その子の 記録を 作る */
function registerScreen(code,inv,claimed){
  gate(`<h2>はじめまして</h2><p>${esc(inv.nick||'先生')} さんからの しょうたいです。<br>アプリで つかう <b>ニックネーム</b> を きめてください。</p>
  <input id="nickIn" maxlength="12" placeholder="ニックネーム（12文字まで）">
  <p class="note">進み具合は オンラインに のこります。本名ではなく ニックネームを おすすめします。</p>
  <div class="mapbtns"><button class="btn" id="regBtn">はじめる</button></div><div class="err" id="gateErr"></div>`);
  $('#regBtn').onclick=async()=>{
    const nick=$('#nickIn').value.trim();if(!nick){$('#gateErr').textContent='ニックネームを 入れてね';return}
    $('#regBtn').disabled=true;
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    const token=claimed||rnd(24,'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'),my=rnd(6);
    if(!claimed){
      try{await db.collection(COL.invites).doc(code).update({uid:token,usedAt:ts})}
      catch(e){
        let used=false;try{const d=await db.collection(COL.invites).doc(code).get();used=!!(d.exists&&(d.data().uid||d.data().cands))}catch(_){}
        if(used){gate(`<h2>この URL は もう つかわれています</h2><p>あたらしく はじめる 人は、しょうたい してくれた人に べつの URL を もらってください。</p>`);return}
        $('#gateErr').textContent='とうろくに しっぱいしました。電波を たしかめて もういちど。';$('#regBtn').disabled=false;return}
    }
    const root=inv.by==='teacher'?code:(inv.root||code);
    P=fresh();P.name=nick;
    try{
      await db.collection(COL.users).doc(token).set({nick,code:my,inv:code,root,progress:P,stage:0,seen:0,cleared:0,created:ts,updated:ts});
      await db.collection(COL.invites).doc(my).set({by:'user',parent:code,root,nick,created:ts}); // みんなの様子 用
    }catch(e){claimed=token;$('#gateErr').textContent='とうろくに しっぱいしました。電波を たしかめて もういちど。';$('#regBtn').disabled=false;return}
    TOKEN=token;ME={nick,code:my,inv:code,root};CUR=code;lsSet(LS.token,token);setRes=[];
    save();boardSave();showOnly('play');start();dartsStart();
  };
}

/* みんなの様子: 行=子ども、列=ステージ */
function boardHTML(users,roots,me){
  const student=!!me,now=Date.now()/1000;
  const sorted=users.slice().sort((a,b)=>((b.stage||0)-(a.stage||0))||((b.updated?.seconds||0)-(a.updated?.seconds||0)));
  const label=c=>{const r=roots.find(x=>x.id===c);return r?(r.label||c):c};
  const dist=Array(STAGES.length).fill(0);sorted.forEach(u=>{const st=Math.min(u.stage||0,STAGES.length-1);if(now-(u.updated?.seconds||0)<14*86400)dist[st]++});
  let h=`<div class="rep"><h3>みんなの様子</h3>
  <div class="legend"><span><i class="d"></i>クリア</span><span><i class="cur"></i>いま やっている</span><span>うすい行 = 7日以上 やっていない</span>${student?'':'<span>赤い数 = そのステージに いる人数</span>'}
  ${student?'':`<label style="margin-left:auto"><select id="bFilter" style="font-size:.85rem"><option value="">すべての枝</option>${roots.map(r=>`<option value="${esc(r.id)}">${esc(r.label||r.id)}</option>`).join('')}</select></label>`}</div>
  <div class="board"><table>
  <tr><th class="nm"></th>${STAGES.map(st=>`<th><div class="ph" style="background:var(${PH[st.p][2]})"></div></th>`).join('')}<th></th></tr>
  ${student?'':`<tr><th class="nm"></th>${STAGES.map((_,i)=>`<th class="n">${i+1}</th>`).join('')}<th></th></tr>
  <tr class="dist"><td class="nm">人数</td>${dist.map(n=>`<td>${n?`<span class="bub">${n}</span>`:''}</td>`).join('')}<td></td></tr>`}`;
  sorted.forEach(u=>{
    const cl=new Set(Array.isArray(u.cl)?u.cl:((u.progress&&u.progress.cleared)||[])),cur=u.stage||0,idle=now-(u.updated?.seconds||0)>7*86400,isMe=student&&u.id===me;
    const last=u.updated&&u.updated.seconds?new Date(u.updated.seconds*1000).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'-';
    h+=`<tr class="${idle?'idle':''}${isMe?' me':''}" data-root="${esc(u.root||'')}"><td class="nm"${student?'':` title="${esc(label(u.root))}"`}>${isMe?'★ ':''}${esc(u.nick)}</td>${STAGES.map((st,i)=>`<td class="c${cl.has(i)?' d':''}${i===cur?' cur':''}" style="--pc:var(${PH[st.p][2]})" title="${esc(u.nick)}　${student?'':(i+1)+' '}${esc(st.name)}${cl.has(i)?'（クリア）':''}${i===cur?'（いま）':''}"></td>`).join('')}<td class="meta">${student?'':`できた ${u.seen||0}/${SEENTOTAL}　${last}`}</td></tr>`});
  if(!sorted.length)h+=`<tr><td class="nm">まだ だれも いません</td></tr>`;
  return h+'</table></div></div>';
}

function reviewPool(){return [];const r=[];for(let i=Math.max(0,P.stage-3);i<P.stage;i++)STAGES[i].facts.forEach(k=>r.push([i,k]));return r}
function pick(){
  CURSEED=null;
  if(P.screen){MODE='screen';isReview=false;NS=P.screen.list[P.screen.i][0];return P.screen.list[P.screen.i][1]}
  if(P.fix&&P.fix.length){MODE='fix';isReview=false;NS=P.fix[0][0];return P.fix[0][1]}
  if(P.lvup){MODE='lvup';isReview=false;NS=P.lvup.to;
    const todo=P.lvup.facts.filter(f=>(P.lvup.st[f]||0)<LVUP_NEED);let c=todo.filter(f=>f!==lastN);if(!c.length)c=todo;
    return choice(c)}
  MODE='normal';
  if(PAIR&&PAIR.stage===P.stage){isReview=false;NS=P.stage;return PAIR.key}
  PAIR=null;
  const rp=reviewPool();
  if(rp.length&&Math.random()<0.3){isReview=true;
    const w=rp.map(([i,k])=>P.weak[i+':'+k]?4:1);let r=Math.random()*w.reduce((x,y)=>x+y,0);
    for(let j=0;j<rp.length;j++){r-=w[j];if(r<=0){NS=rp[j][0];return rp[j][1]}}

  /* かたよらない ように: その レベルで 出る 問題を ぜんぶ 1まいずつ 入れた 山を まぜて、上から じゅんに 出す（なくなったら まぜなおし） */
  if(!DECK||DECK.stage!==P.stage||!DECK.list.length){let l=buildDeck(P.stage);if(l.length>1&&l[0].id===LASTID)l.push(l.shift());DECK={stage:P.stage,list:l}}

/* ===== タイル（静止画）: たしざんラボと同じ 四角い タイル。たてに 下から つむ。5の ところに すきま =====
   cells の 文字: a=青（もとの数） b=オレンジ（たす数・かくれた数） e=から x=とる（赤） hl=ちがいの ところ */
const F=()=>$('#field');

function sign(t){const s=el('div','tsign');s.textContent=t;return s}

/* ---- 補数の わく（さんすうドットの たしざんと 同じ: 5こずつの わくに 左から ならべる）＋ くさむらで 横に かくす（ぴょんと 同じ） ----
   size: わくの 数（5 か 10）。blue: 見えている 数。orange: くさむらの 中の 数。くさむらは blue の つぎから わくの おわりまで */
function hrow(size,blue,orange,bushOn){
  const f=F();f.innerHTML='';const w=el('div','tscene');const r=el('div','trow');
  for(let g=0;g<size/5;g++){const gw=el('div','g5w');for(let i=0;i<5;i++){const n=g*5+i;gw.appendChild(el('span','tc '+(n<blue?'a':n<blue+orange?'b':'e')))}r.appendChild(gw)}
  const bu=el('div','bush'+(bushOn?'':' off'));bu.innerHTML='<span>？</span>';r.appendChild(bu);
  w.appendChild(r);f.appendChild(w);
  const place=()=>{const cs=r.querySelectorAll('.tc');const rr=r.getBoundingClientRect();
    const left=blue<cs.length?cs[blue].getBoundingClientRect().left-rr.left-5:cs[cs.length-1].getBoundingClientRect().right-rr.left+4;
    bu.style.left=left+'px';bu.style.right='0px'};
  place();requestAnimationFrame(place);

}
/* こたえあわせ: くさむらが どいて、かくれていた ぶんが 見える。5の かたまりにも 枠と「5」 */
function reveal(){const r=F().querySelector('.trow');if(!r)return;const bu=r.querySelector('.bush');if(bu)bu.classList.add('lift');
  r.querySelectorAll('.g5w').forEach(g=>{if(![...g.children].some(t=>t.classList.contains('e')))g.classList.add('full')})}
/* ===== たし算の わく（さんすうドット トレーニングの たしざんと 同じ: 横ながの 10の わく 5×2、左上から ならべる。
   こたえの あとは「5と5で 10」「10を つくる」の うごき（buildAddPlan は ドットの ものを そのまま） ===== */
let FS=null; // {wrap, frames:{id:el}, dots:[{el,frame,idx,cls}]}
function fscene(parts,xc){ /* parts: [{id,n,cls}] か '＋' */
  const f=F();f.innerHTML='';const w=el('div','fscene'+(parts.filter(p=>typeof p!=='string').length>2?' n3':'')+(xc?' '+xc:''));f.appendChild(w);FS={wrap:w,frames:{},dots:[]};
  parts.forEach(p=>{if(typeof p==='string'){const s=el('div','fsign');s.textContent=p;w.appendChild(s);return}
    const fr=el('div','fr');for(let i=0;i<10;i++)fr.appendChild(el('div','fc2'));w.appendChild(fr);FS.frames[p.id]=fr});
  parts.forEach(p=>{if(typeof p!=='string')fdots(p.id,p.n,p.cls,p.from||0)});
}
function fpos(fid,idx){const c=FS.frames[fid].children[idx].getBoundingClientRect(),s=FS.wrap.getBoundingClientRect();return {x:c.left-s.left,y:c.top-s.top}}
function fdots(fid,n,cls,from){for(let i=0;i<n;i++){const k=Array.isArray(cls)?cls[i]:cls,p=fpos(fid,from+i),d=el('div','ft '+k);d.style.left=p.x+'px';d.style.top=p.y+'px';FS.wrap.appendChild(d);FS.dots.push({el:d,frame:fid,idx:from+i,cls:k})}}
function frelayout(){if(!FS||!FS.wrap.isConnected)return;FS.dots.forEach(d=>{const p=fpos(d.frame,d.idx),t=d.el.style.transition;d.el.style.transition='none';d.el.style.left=p.x+'px';d.el.style.top=p.y+'px';void d.el.offsetWidth;d.el.style.transition=t})}
window.addEventListener('resize',frelayout);
function applyMoves(mv){
  const picks=mv.map(m=>({m,d:FS.dots.find(d=>d.frame===m.f&&d.idx===m.i)})).filter(p=>p.d);
  picks.forEach(p=>{const pos=fpos(p.m.tf,p.m.ti);p.d.el.style.left=pos.x+'px';p.d.el.style.top=pos.y+'px'});
  picks.forEach(p=>{p.d.frame=p.m.tf;p.d.idx=p.m.ti});

function frameName(f){return f==='A'?'ひだり':'みぎ'}
function buildAddPlan(a,b){
  var sum=a+b;var anchor=(sum>10)?10:(sum>=5?5:0);var rest=anchor?sum-anchor:0;var mv=[],i;
  if(sum>=15){var qa=a-5,qb=b-5;var nA=5-qa,nB=5-qb;var keepF=(nA<=nB)?'A':'B';var srcF=(keepF==='A')?'B':'A';var need=(keepF==='A')?nA:nB;var qs=(srcF==='A')?qa:qb;var qd=(keepF==='A')?qa:qb;
    for(i=0;i<need;i++)mv.push({f:srcF,i:5+qs-need+i,tf:keepF,ti:5+qd+i});
    return {anchor:10,anchorFrame:keepF,rest:rest,mv:mv,hint:frameName(keepF)+'の したの だんを 5に すると 10。のこりは '+rest+'こ'}}
  if(anchor===10&&a>=5&&b>=5){var pa=a-5,pb=b-5;var giver=(pa>=pb)?'A':'B';var keeper=(giver==='A')?'B':'A';var pg=(giver==='A')?pa:pb;var pk=(keeper==='A')?pa:pb;
    for(i=0;i<5;i++)mv.push({f:giver,i:i,tf:keeper,ti:5+i});for(i=0;i<pg;i++)mv.push({f:giver,i:5+i,tf:giver,ti:i});for(i=0;i<pk;i++)mv.push({f:keeper,i:5+i,tf:giver,ti:pg+i});
    return {anchor:10,anchorFrame:keeper,rest:rest,mv:mv,hint:'ひだりの 5と みぎの 5で 10。のこりは '+rest+'こ'}}
  if(anchor===0){var src=(a<=b)?'A':'B';var dst=(src==='A')?'B':'A';var sn=(src==='A')?a:b;var dn=(dst==='A')?a:b;for(i=0;i<sn;i++)mv.push({f:src,i:i,tf:dst,ti:dn+i});
    return {anchor:0,anchorFrame:dst,rest:0,mv:mv,hint:'まとめて みよう'}}
  var best=null;
  ['A','B'].forEach(function(fr){var other=(fr==='A')?'B':'A';var own=(fr==='A')?a:b;var on=(fr==='A')?b:a;var cand=null;
    if(own===anchor){cand={cost:0,keep:fr,n:0}}else if(own>anchor){var n1=own-anchor;if(on+n1<=10)cand={cost:n1,keep:fr,src:fr,dst:other,n:n1,give:true}}
    else{var n2=anchor-own;if(on>=n2)cand={cost:n2,keep:fr,src:other,dst:fr,n:n2,give:false}}
    if(cand&&(!best||cand.cost<best.cost))best=cand});
  var hint;
  if(best.cost===0){hint=frameName(best.keep)+'は もう '+anchor+'だね'}
  else{var sn2=(best.src==='A')?a:b;var dn2=(best.dst==='A')?a:b;for(i=0;i<best.n;i++)mv.push({f:best.src,i:sn2-best.n+i,tf:best.dst,ti:dn2+i});
    hint=best.give?(frameName(best.keep)+'の おおい '+best.n+'こ を うつして '+anchor+'を のこすよ'):(frameName(best.keep)+'に '+best.n+'こ たして '+anchor+'を つくるよ')}
  return {anchor:anchor,anchorFrame:best.keep,rest:rest,mv:mv,hint:hint};
}
const wait=ms=>new Promise(r=>setTimeout(r,ms*(P.aspeed||1)));
function uncover(){const c=F().querySelector('.cover,.qmark');if(c)c.remove()}
/* a＋b（どちらも 10まで）の わくと うごき。keep=true は「5と5で 10」（うごかさずに 5と5を 見せる） */
function addFrames(a,b,keep){
  const draw=()=>fscene([{id:'A',n:a,cls:'a'},'＋',{id:'B',n:b,cls:'b'}]);
  const after=async()=>{if(!FS||!FS.wrap.isConnected||!FS.frames.A){draw();await wait(400)}uncover();
    if(keep){const rest=(a-5)+(b-5);$('#read').textContent='ひだりの 5と みぎの 5で 10。のこりは '+rest+'こ';await wait(400);FS.frames.A.classList.add('full');FS.frames.B.classList.add('full');return}
    if(a+b===10){ /* あわせて 10: うごかす かずが すくない ほうを えらぶ（9＋1 は 1を うつして 10、6＋4 は 1を うつして 5と5、5＋5 は そのまま） */
      if(a===5){$('#read').textContent='5と 5で 10';await wait(400);FS.frames.A.classList.add('full');FS.frames.B.classList.add('full');return}
      const big=a>b?'A':'B',sm=big==='A'?'B':'A',bn=Math.max(a,b),sn=Math.min(a,b);let mv=[],hint;
      if(sn<bn-5){for(let i=0;i<sn;i++)mv.push({f:sm,i,tf:big,ti:bn+i});hint=`${frameName(big)}に ${sn}こ うつして 10`}
      else{const n=bn-5;for(let i=0;i<n;i++)mv.push({f:big,i:bn-n+i,tf:sm,ti:sn+i});hint=`${frameName(big)}の ${n}こ を うつして 5と 5で 10`}
      $('#read').textContent=hint;await wait(500);applyMoves(mv);await wait(950);
      if(sn<bn-5)FS.frames[big].classList.add('full');else{FS.frames.A.classList.add('full');FS.frames.B.classList.add('full')}return}
    const plan=buildAddPlan(a,b);$('#read').textContent=plan.hint;await wait(500);applyMoves(plan.mv);await wait(950);
    if(plan.anchor&&plan.anchorFrame)FS.frames[plan.anchorFrame].classList.add('full')};
  return {draw,after,reveal:after};
}
/* 10と いくつ ＋ いくつ（くりあがり なし）: 10の わく・いくつの わく ＋ たす わく。たす ぶんを いくつの わくへ */

  const after=async()=>{if(!FS||!FS.wrap.isConnected||!FS.frames.T){draw();await wait(400)}uncover();FS.frames.T.classList.add('full');
    if(o){$('#read').textContent=`${o} と ${b} で ${o+b}`;await wait(400);applyMoves(Array.from({length:b},(_,i)=>({f:'B',i,tf:'A',ti:o+i})));await wait(900)}

/* たし算の こたえの 形（10を つくった あと）を そのまま 見せて、ひく ぶんを 赤く */
function sumFrames(a,b,t){const s=a+b,cols=[...cells(a,'a'),...cells(b,'b')];const xs=cols.map(c=>(t===b&&c==='b')||(t===a&&c==='a')?'x':c);

/* ===== ひき算も 横の わくで。とる ぶんは 赤く して 上へ きえる ===== */
function fset(fid,from,to,cls){FS.dots.filter(d=>d.frame===fid&&d.idx>=from&&d.idx<to).forEach(d=>{d.el.classList.add(cls);d.cls=cls})}
function fdrop(fid,from,to){const ds=FS.dots.filter(d=>d.frame===fid&&d.idx>=from&&d.idx<to);ds.forEach(d=>{d.el.classList.add('x');d.el.classList.add('gone')});FS.dots=FS.dots.filter(d=>!ds.includes(d));setTimeout(()=>ds.forEach(d=>d.el.remove()),700)}

/* a − b（a≦10）: とる ぶんは さいしょから 赤。こたえで きえる */
function leftFrames(a,b){const r=a-b;

function teenSubFrames(a,b){const o=a-10;

function showKiroku(st,from){
  kFrom=from||'map';P.rec=P.rec||{};let cur_=st;const tabs=$('#ktabs');tabs.innerHTML='';
  STAGES.forEach((s,i)=>{const b=el('button','ktab'+(i===cur_?' sel':'')+((P.rec[i]||[]).length?'':' none'));b.textContent=`${i+1} ${s.name}`;
    b.onclick=()=>{cur_=i;tabs.querySelectorAll('.ktab').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');draw()};tabs.appendChild(b)});
  function draw(){const rows=P.rec[cur_]||[],body=$('#kbody');
    if(!rows.length){body.innerHTML='<div class="kempty">まだ きろくが ありません</div>';return}
    const recent=rows.slice(-20),rate=recent.map(r=>r.c),per=recent.map(r=>Math.round(r.t/r.n)/10);
    const d=t=>{const x=new Date(t);return `${x.getMonth()+1}/${x.getDate()} ${x.getHours()}:${String(x.getMinutes()).padStart(2,'0')}`};
    body.innerHTML=`<div class="kbox"><div class="ct">ぱっと見で できた かず（さいきん ${recent.length}かい）</div><div class="cv" style="color:var(--dot)">${rate[rate.length-1]} / ${SET}</div>${kChart(rate,'#3b82c4',0,SET,'こ')}</div>
      <div class="kbox"><div class="ct">1もん あたりの じかん</div><div class="cv" style="color:#dd6b3a">${per[per.length-1].toFixed(1)} びょう</div>${kChart(per,'#dd6b3a',0,null,'びょう')}</div>
      <div class="kbox"><div class="ct">さいきんの きろく</div><table class="krec"><thead><tr><th>いつ</th><th>ぱっと見</th><th>じかん</th></tr></thead><tbody>${rows.slice(-10).reverse().map(r=>`<tr><td>${d(r.at)}</td><td>${r.c} / ${r.n}</td><td>${kFmtT(r.t)}</td></tr>`).join('')}</tbody></table></div>`}
  draw();showOnly('kiroku')}

/* ===== デバッグモード（リンクの末尾に #debug）: 好きな場面を すぐ たしかめる ===== */
const DBG={next:null,mode:null,h:null};
if(DEBUG){
  const _pick=pick;pick=function(){if(DBG.next!=null){const v=DBG.next;DBG.next=null;CURSEED=null;isReview=false;NS=P.stage;PAIR=null;return cur().facts.find(f=>String(f)===v)??v}return _pick()};
  window.__T={get Q(){return Q},showResult:()=>showResult(),buildDeck:i=>buildDeck(i),get phase(){return phase},get P(){return P},get setRes(){return setRes},answer:v=>answer(v),start:()=>start()};
  const st=document.createElement('style');st.textContent=`
  #dbgBtn{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;font-family:var(--font-display);font-weight:900;border:none;border-radius:999px;padding:10px 16px;background:var(--ink);color:var(--paper);box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer}
  #dbg{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:50;max-width:520px;margin-left:auto;max-height:70vh;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #dbg h4{margin:8px 0 4px;font-family:var(--font-display);font-size:.9rem}
  #dbg .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #dbg button,#dbg select,#dbg input{font-family:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg);color:var(--ink)}
  #dbg button{cursor:pointer;font-weight:800}
  #dbg .ans{font-family:ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:6px 8px;font-weight:800;color:var(--accent)}`;
  document.head.appendChild(st);
  const b=document.createElement('button');b.id='dbgBtn';b.textContent='デバッグ';document.body.appendChild(b);
  const p=document.createElement('div');p.id='dbg';p.hidden=true;document.body.appendChild(p);
  
  p.innerHTML=`<div class="r" style="justify-content:space-between"><b>デバッグ</b><button id="dX">とじる</button></div>
  <h4>いま</h4><div class="ans" id="dNow"></div>
  <h4>レベル</h4><div class="r"><select id="dSt">${STAGES.map((s,i)=>`<option value="${i}">Lv.${i+1} ${s.name}</option>`).join('')}</select><button id="dGo">ここから</button></div>
  <h4>つぎの 問題を 指定</h4><div class="r">しゅるい <select id="dN"></select><button id="dAsk">この問題を 出す</button></div>
  <h4>見せる時間</h4><div class="r">${[['0.5','×0.5'],['1','ふつう'],['3','×3'],['20','ほぼ 出しっぱなし']].map(([v,t])=>`<button data-sp="${v}">${t}</button>`).join('')}</div>
  <h4>結果を 見る</h4><div class="r"><button id="dG">10問 ぜんぶ正解で おわる（クリア）</button><button id="dS">8問正解で おわる</button><button id="dB">0問で おわる</button></div>
  <h4>クリア状態</h4><div class="r"><button id="dIs">この せかいを ぜんぶ クリア</button><button id="dAll">ぜんぶ クリア（ライセンス）</button><button id="dRs">記録を ぜんぶ 消す</button></div>
  <h4>画面</h4><div class="r"><button id="dMap">ちず</button><button id="dAd">おとな</button><button id="dRep">おうちへ</button><button id="dPlay">もんだいへ</button></div>`;
  const q=s=>p.querySelector(s);
  const fillN=()=>{q('#dN').innerHTML=cur().facts.map(v=>`<option>${v}</option>`).join('')};
  b.onclick=()=>{p.hidden=!p.hidden;q('#dSt').value=P.stage;fillN()};q('#dX').onclick=()=>p.hidden=true;
  const tick=()=>{if(p.hidden)return;let a='';try{a=dbgAnswer()}catch(e){a='—'}q('#dNow').textContent=`Lv.${P.stage+1} ／ ${setRes.length}/${SET}問 おわり ／ 答え: ${a}`};setInterval(tick,400);
  q('#dGo').onclick=()=>{P.stage=+q('#dSt').value;setRes=[];PAIR=null;save();showOnly('play');start();fillN()};
  q('#dAsk').onclick=()=>{DBG.next=q('#dN').value;showOnly('play');start()};
  p.querySelectorAll('[data-sp]').forEach(x=>x.onclick=()=>{P.speed=+x.dataset.sp;save();showOnly('play');start()});
  const finish=(n,fill)=>{if(fill)cur().facts.forEach(f=>setSp(f,need()));setRes=Array.from({length:SET},(_,i)=>i<n?'p':'o');showOnly('play');qToken++;showResult()};
  q('#dG').onclick=()=>finish(SET,true);q('#dS').onclick=()=>finish(8,false);q('#dB').onclick=()=>finish(0,false);
  q('#dIs').onclick=()=>{STAGES.forEach((s,i)=>{if(s.p===cur().p&&!P.cleared.includes(i))P.cleared.push(i)});save();renderMap();showOnly('map')};
  q('#dAll').onclick=()=>{STAGES.forEach((s,i)=>{if(!P.cleared.includes(i))P.cleared.push(i)});save();renderMap();showOnly('map');$('#licBtn').click()};
  q('#dRs').onclick=()=>{P=fresh();setRes=[];save();showOnly('play');start()};
  q('#dMap').onclick=()=>{renderMap();showOnly('map')};
  q('#dAd').onclick=()=>{showOnly('play');adultOn=true;$('#adult').hidden=false;renderAdult()};
  q('#dRep').onclick=()=>{renderReport();showOnly('rep')};
  q('#dPlay').onclick=()=>{showOnly('play');start()};
}

boot().then(()=>{if(FREE){renderMap();showOnly('map')}});
})();
</script>
